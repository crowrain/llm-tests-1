name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The documented range: minimum supported (3.9) and the newest tested (3.14).
        python-version: ["3.9", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # -s tests scopes discovery to the test package. A bare `discover` also matches the
      # harness entry points (they are named test_quality_*.py) and imports them, so a
      # dataset fetch that ever moved to module level would reach the network from CI.
      # -t . keeps the repository root importable, for `import quality_common`.
      - name: Run regression tests
        run: python -m unittest discover -s tests -t . -v
